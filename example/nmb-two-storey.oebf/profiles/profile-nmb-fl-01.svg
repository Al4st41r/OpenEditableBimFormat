<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1.000 0.256"
     width="1000mm" height="256mm">
  <!-- Internal floor finish allowance: 0-20 mm from the top face -->
  <rect x="0" y="0.000" width="1.000" height="0.020" fill="#BFA98C" stroke="#888" stroke-width="0.002"/>
  <!-- Screedboard: 20-40 mm from the top face -->
  <rect x="0" y="0.020" width="1.000" height="0.020" fill="#C9C9C0" stroke="#888" stroke-width="0.002"/>
  <!-- Rigid insulation with underfloor heating: 40-75 mm from the top face -->
  <rect x="0" y="0.040" width="1.000" height="0.035" fill="#E3D98A" stroke="#888" stroke-width="0.002"/>
  <!-- Acoustic matting: 75-83 mm from the top face -->
  <rect x="0" y="0.075" width="1.000" height="0.008" fill="#7B8FA3" stroke="#888" stroke-width="0.002"/>
  <!-- CLT floor panel (302): 83-223 mm from the top face -->
  <rect x="0" y="0.083" width="1.000" height="0.140" fill="#D9B36B" stroke="#888" stroke-width="0.002"/>
  <!-- Wall lining board (311): 223-238 mm from the top face -->
  <rect x="0" y="0.223" width="1.000" height="0.015" fill="#E6E6E0" stroke="#888" stroke-width="0.002"/>
  <!-- Wall lining board (311): 238-253 mm from the top face -->
  <rect x="0" y="0.238" width="1.000" height="0.015" fill="#E6E6E0" stroke="#888" stroke-width="0.002"/>
  <!-- Skim and paint: 253-256 mm from the top face -->
  <rect x="0" y="0.253" width="1.000" height="0.003" fill="#F7F7F2" stroke="#888" stroke-width="0.002"/>
</svg>
