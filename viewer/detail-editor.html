<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEBF Detail Editor</title>
  <link rel="icon" href="/oebf/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/oebf/fonts/barlow.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; color: #ddd; font-family: 'Barlow', sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; }
    button, select, input { font: inherit; }
    #header { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; padding: 6px 10px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; }
    #header select, #header input, .panel select, .panel input[type=text], .panel input[type=number] { background: #333; color: #ddd; border: 1px solid #555; padding: 3px 6px; border-radius: 3px; }
    button { padding: 4px 8px; cursor: pointer; background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px; }
    button:hover:not(:disabled) { background: #444; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.primary { background: #2a4a2a; color: #8f8; }
    button.primary:hover:not(:disabled) { background: #3a5a3a; }
    button.active { background: #1e3a5a; border-color: #4a8aaa; color: #fff; }
    .sep { width: 1px; align-self: stretch; background: #333; margin: 0 4px; }
    #project-name { opacity: 0.6; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #detail-select { max-width: 130px; }
    #material-select { max-width: 100px; }
    #export-select { max-width: 96px; }
    #header .sep { margin: 0 1px; }
    #status { position: absolute; left: 10px; bottom: 10px; z-index: 5; max-width: 62%; padding: 5px 10px; border-radius: 4px; background: rgba(24,24,24,0.88); color: #ddd; font-size: 12px; pointer-events: none; }
    #status:empty { display: none; }
    #status.error { color: #f99; border: 1px solid #733; }
    #dirty { color: #fc6; font-size: 18px; line-height: 1; }
    #main { display: flex; flex: 1; min-height: 0; }
    .panel { overflow-y: auto; padding: 8px 12px; background: #1e1e1e; flex-shrink: 0; }
    #left-panel { width: 250px; border-right: 1px solid #333; }
    #right-panel { width: 340px; border-left: 1px solid #333; }
    #canvas-wrap { flex: 1; min-width: 0; position: relative; background: #f2f1ed; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
    #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; text-align: center; padding: 24px; pointer-events: none; }
    #empty[hidden] { display: none; }
    #tip { position: absolute; pointer-events: none; z-index: 5; background: rgba(24,24,24,0.92); color: #fff; padding: 5px 9px; border-radius: 3px; font-size: 12px; line-height: 1.45; white-space: nowrap; border-left: 3px solid #e8590c; }
    #tip[hidden] { display: none; }
    #sheet-dialog { background: #222; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 14px 18px; min-width: 320px; }
    #sheet-dialog::backdrop { background: rgba(0,0,0,0.5); }
    #sheet-dialog > button { margin-right: 6px; margin-top: 8px; }
    #help-dialog { background: #222; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 14px 18px; max-width: 620px; max-height: 80vh; overflow-y: auto; }
    #publish-dialog { background: #222; color: #ddd; border: 1px solid #555; border-radius: 6px; padding: 14px 18px; max-width: 700px; max-height: 80vh; overflow-y: auto; font-size: 12px; }
    #publish-dialog::backdrop { background: rgba(0,0,0,0.5); }
    #publish-dialog code { display: block; background: #151515; padding: 4px 8px; margin: 3px 0; user-select: all; }
    #object-dialog { max-width: 820px; max-height: 88vh; overflow-y: auto; font-size: 12px; }
    #object-dialog::backdrop { background: rgba(0,0,0,0.5); }
    #object-dialog h3 { margin: 0 0 8px; }
    #object-dialog .row { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
    #object-dialog .row > label { width: 90px; opacity: 0.7; }
    #object-dialog input, #object-dialog select { background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 3px 5px; font-size: 12px; }
    #object-dialog input[type=number] { width: 64px; }
    #object-dialog .part { border: 1px solid #444; border-radius: 4px; padding: 6px 8px; margin: 6px 0; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
    #object-dialog .part label { opacity: 0.7; }
    #object-dialog .previews { display: flex; gap: 12px; margin: 8px 0; }
    #object-dialog .previews div { flex: 1; background: #151515; border: 1px solid #333; border-radius: 4px; height: 150px; padding: 4px; }
    #object-dialog .previews svg { width: 100%; height: 100%; }
    #object-dialog .previews small { display: block; opacity: 0.5; text-align: center; }
    #object-dialog .problems { color: #f08080; margin: 6px 0; }
    #object-dialog .actions { display: flex; gap: 6px; margin-top: 10px; }
    #help-dialog::backdrop { background: rgba(0,0,0,0.5); }
    #help-dialog dl { display: grid; grid-template-columns: 150px 1fr; gap: 3px 12px; margin: 0 0 6px; font-size: 12px; }
    #help-dialog dt { color: #fff; font-family: monospace; }
    #help-dialog dd { margin: 0; color: #bbb; }
    #cmd { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; background: rgba(24,24,24,0.94); border: 1px solid #555; border-radius: 4px; padding: 6px 8px; display: flex; align-items: center; gap: 10px; }
    #cmd[hidden] { display: none; }
    #cmd-input { width: 260px; background: #333; color: #fff; border: 1px solid #777; padding: 4px 8px; border-radius: 3px; }
    #cmd-hint { color: #aaa; font-size: 12px; white-space: nowrap; }
    #tip .t { font-weight: 700; }
    #tip .c { opacity: 0.6; }
    #marks-menu { position: relative; }
    #marks-menu summary { cursor: pointer; padding: 4px 10px; background: #333; border: 1px solid #555; border-radius: 3px; list-style: none; white-space: nowrap; }
    #marks-menu.active summary { background: #1e3a5a; border-color: #0a6cff; }
    #marks-menu-body { position: absolute; z-index: 20; top: 30px; left: 0; background: #262626; border: 1px solid #555; border-radius: 3px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
    #marks-menu-body button { text-align: left; }
    .unitbox { margin: 2px 0 8px 12px; padding-left: 8px; border-left: 2px solid #333; }
    .layerend { display: grid; grid-template-columns: 1fr 62px 62px 24px; gap: 3px; align-items: center; margin: 3px 0; font-size: 12px; }
    .layerend.head { color: #888; font-size: 10px; text-transform: uppercase; }
    .layerend > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layerend input { min-width: 0; }
    .layerstart { display: grid; grid-template-columns: 1fr 44px 74px 24px; gap: 3px; align-items: center; margin: 3px 0; font-size: 12px; }
    .layerstart > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .layerstart input { min-width: 0; }
    .refline { display: grid; grid-template-columns: 62px 38px 1fr 1fr 22px; gap: 3px; margin: 3px 0; }
    .refline > * { min-width: 0; }
    #snap-menu { position: relative; }
    #snap-menu summary { cursor: pointer; padding: 4px 10px; background: #333; border: 1px solid #555; border-radius: 3px; list-style: none; }
    #snap-menu-body { position: absolute; z-index: 20; top: 30px; left: 0; background: #262626; border: 1px solid #555; border-radius: 3px; padding: 8px 10px; min-width: 190px; }
    #snap-menu-body label { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 12px; }
    h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin: 12px 0 6px; }
    h3:first-child { margin-top: 0; }
    .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .row > label { flex: 0 0 82px; opacity: 0.7; font-size: 12px; }
    .row > input, .row > select { flex: 1; min-width: 0; }
    .item { padding: 4px 8px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .item:hover { background: #2a2a2a; }
    .item.selected { background: #1e3a5a; }
    .item .meta { opacity: 0.55; font-size: 11px; margin-left: auto; }
    .layer { display: flex; align-items: center; gap: 4px; padding: 2px 8px; }
    .layer button { font-size: 11px; padding: 1px 6px; min-width: 52px; opacity: 0.6; }
    .layer button.on { opacity: 1; }
    .layer .off { opacity: 0.4; text-decoration: line-through; }
    .item .swatch { width: 10px; height: 10px; border: 1px solid #555; flex-shrink: 0; }
    .warn { color: #fc6; }
    .err { color: #f88; }
    .note { opacity: 0.55; font-size: 11px; margin: 4px 0; }
    .msg { font-size: 12px; margin: 3px 0; }
    .box { border: 1px solid #333; border-radius: 3px; padding: 6px 8px; margin: 6px 0; }
    .param { margin: 6px 0; padding: 6px 8px; border: 1px solid #333; border-radius: 3px; }
    .param input[type=range] { width: 100%; }
    .vtx { display: grid; grid-template-columns: 18px minmax(0,1fr) minmax(0,1fr); gap: 4px; align-items: center; margin: 3px 0; }
    .vtx.selected { background: #1e3a5a; border-radius: 3px; }
    .tabs { display: flex; gap: 2px; margin: -8px -12px 10px; padding: 6px 8px 0; position: sticky; top: -8px; z-index: 3; background: #1e1e1e; border-bottom: 1px solid #333; }
    .tab { flex: 1; padding: 5px 4px; border: 0; border-bottom: 2px solid transparent; border-radius: 3px 3px 0 0; background: transparent; color: #999; font-size: 12px; }
    .tab:hover:not(:disabled) { color: #ddd; background: #262626; }
    .tab.active { color: #fff; border-bottom-color: #4a8aaa; background: #262626; }
    .tab:disabled { opacity: 0.35; }
    .badge { display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 8px; background: #b33; color: #fff; font-size: 10px; }
    .fold { margin: 8px 0; border-top: 1px solid #333; padding-top: 6px; }
    .fold.first { margin-top: 0; border-top: 0; padding-top: 0; }
    .fold > summary { cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin-bottom: 4px; }
    .vtx select, .vtx input { min-width: 0; width: 100%; }
    .bound { color: #8cf; font-size: 11px; }
    .box.hl { border-color: #0a6cff; box-shadow: 0 0 0 1px #0a6cff; }
    .ref { margin: 4px 0; line-height: 0; }
    .ref svg { width: 100%; height: auto; display: block; border-radius: 3px; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0; font-size: 11px; }
    .legend .lg { display: inline-flex; align-items: center; gap: 4px; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .legend i.hollow { background: transparent; border: 2px solid #888; box-sizing: border-box; }
    dialog { background: #222; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 16px; margin: auto; }
    dialog::backdrop { background: rgba(0,0,0,0.5); }
  </style>
  <script>
    // Keep uncaught errors where headless checks and bug reports can read them.
    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(e.message));
    window.addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason)));
  </script>
</head>
<body>
  <div id="header">
    <span id="project-name">No bundle open</span>
    <select id="detail-select" disabled><option value="">— select detail —</option></select>
    <button id="new-btn" disabled>New</button>
    <button id="objects-btn" disabled title="Make a small multi-part object (a screw, a brick tie, a cavity tray) and keep it in the bundle for reuse">Objects</button>
    <button id="view-switch-btn" disabled title="Switch to the same junction in the other view: plan or section">Plan / Section</button>
    <span class="sep"></span>
    <button id="open-btn" title="Open a bundle folder">Folder</button>
    <button id="open-file-btn" title="Open a .oebfz archive">File</button>
    <button id="demo-btn">Demo</button>
    <select id="export-select" title="Export this detail as a CAD drawing"><option value="">Export…</option><option value="json">Detail JSON</option><option value="sheet">Sheet (SVG or PDF)…</option><option value="dxf">DXF (mm)</option><option value="import-dxf">Import DXF…</option></select>
    <button id="zip-btn" hidden title="Download the whole bundle as a zip">Zip</button>
    <span class="sep"></span>
    <button id="tool-select" class="active" title="Select and move (V)">Select</button>
    <button id="tool-rect" title="Rectangle region (R)">Rect</button>
    <button id="tool-polygon" title="Polygon region (P)">Polygon</button>
    <button id="tool-measure" title="Measure distance and angle between two points (M)">Measure</button>
    <details id="marks-menu"><summary id="marks-summary" title="Lines, arcs, circles, dimensions and notes">Marks</summary><div id="marks-menu-body">
      <button id="tool-line" title="Open line: a break line, centre line or damp-proof course (L). Enter or double-click finishes.">Line</button>
      <button id="tool-arc" title="Arc: centre, start, end, anticlockwise (A)">Arc</button>
      <button id="tool-circle" title="Circle: centre and a point on it (C)">Circle</button>
      <button id="tool-dim" title="Dimension between two points (D)">Dim</button>
      <button id="tool-note" title="Note with a leader line (N)">Note</button>
    </div></details>
    <select id="material-select" title="Material for new regions" disabled></select>
    <button id="thin-btn" title="Draw every line as a hairline, so the drawing reads as a sketch. Pen weights are kept in the data.">Thin</button>
    <button id="snap-btn" class="active" title="Snapping on or off (S). Hold Alt to suspend it while you move.">Snap</button>
    <details id="snap-menu"><summary title="Which snaps are active">Snaps</summary><div id="snap-menu-body"></div></details>
    <span class="sep"></span>
    <button id="undo-btn" disabled title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo-btn" disabled title="Redo (Ctrl+Y)">Redo</button>
    <button id="fit-btn" title="Fit to view (F)">Fit</button>
    <select id="units-select" title="Display units"><option value="mm" selected>mm</option><option value="m">m</option></select>
    <span class="sep"></span>
    <span id="dirty" hidden title="Unsaved changes">●</span>
    <button id="publish-btn" title="Download the edited files and show how to put them on the site">Publish</button>
    <button id="profile-btn" title="Edit the profile of the selected member (opens the profile editor); changes come back here when you save there">Profile</button>
    <button id="view3d-btn" title="See this detail in 3D, including unsaved changes (opens the review page)">3D</button>
    <button id="help-btn" title="Keyboard and mouse shortcuts (?)">?</button>
    <button id="save-btn" class="primary" disabled title="Save (Ctrl+S)">Save</button>
  </div>
  <div id="main">
    <div id="left-panel" class="panel"></div>
    <div id="canvas-wrap">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="tip" hidden></div>
      <div id="status" role="status"></div>
      <div id="cmd" hidden><input id="cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="2400,1200   @300,0   500<45   or a distance"><span id="cmd-hint"></span></div>
      <div id="empty">Open a bundle or the demo, then choose a detail.</div>
    </div>
    <div id="right-panel" class="panel"></div>
  </div>
  <dialog id="help-dialog"></dialog>
  <dialog id="publish-dialog"></dialog>
  <dialog id="sheet-dialog"></dialog>
  <dialog id="new-dialog"></dialog>
  <dialog id="object-dialog"></dialog>
  <dialog id="loc-dialog"></dialog>
  <input id="dxf-input" type="file" accept=".dxf" hidden>
  <input id="oebfz-input" type="file" accept=".oebfz" hidden>
  <script type="module" src="/src/detail-editor/editor.js"></script>
</body>
</html>
