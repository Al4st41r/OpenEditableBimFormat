<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEBF Profile Editor</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/barlow.css">
  <link rel="stylesheet" href="/src/ui/ui.css">
  <style>
    [hidden] { display: none !important; }
    @media (max-width: 1599px) { .short .lbl { display: none; } }   /* secondary commands show only their icon on narrower screens */

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; color: #ddd; font-family: 'Barlow', sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; }

    #header {
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
      padding: 6px 12px; background: #222; border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    #header select, #header input { background: #333; color: #ddd; border: 1px solid #555; padding: 4px 8px; border-radius: 3px; }
    /* a long profile id must not widen the toolbar onto a second row (#158, #167); the open list shows the full ids */
    #profile-select { max-width: 9rem; text-overflow: ellipsis; }
    #header button { padding: 4px 10px; font-size: 12px; cursor: pointer; background: #2a4a2a; color: #8f8; border: 1px solid #555; border-radius: 3px; }
    #header button:hover { background: #3a5a3a; }
    #header button.secondary { background: #333; color: #ddd; }
    #header button { display: inline-flex; align-items: center; gap: 5px; }
    #header button:disabled { opacity: 0.45; cursor: default; }
    #header .sep { width: 1px; height: 20px; background: #444; margin: 0 2px; }
    #dirty { color: #e8b04a; font-size: 14px; }
    /* the status takes what room is left and shortens to fit, so a long message never wraps the toolbar (#158) */
    #status { margin-left: auto; flex: 1 1 0; min-width: 0; color: #aaa; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #main { display: flex; flex: 1; overflow: hidden; }

    #canvas-panel {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #111; border-right: 1px solid #333;
      overflow: hidden;   /* the svg draws outside its box; keep it off the form panel */
    }
    #profile-svg {
      border: 1px solid #333; background: #fff;
      height: 100%; width: auto; max-width: 100%;
      overflow: visible;
    }

    #profile-meta label { white-space: nowrap; }   /* "FFL (mm)" stays on one line; the row wraps instead */
    #canvas-prompt { color: #999; font-size: 14px; text-align: center; max-width: 360px; line-height: 1.5; }
    /* the line-weight pens match the other dark controls (#162) */
    #lineweights-bar select { background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 2px 4px; font-size: 11px; }
    #lineweights-bar label { display: inline-flex; align-items: center; gap: 4px; }
    #lineweights-bar input[type=checkbox] { accent-color: #6e8ec8; }
    /* the layer rows (name, thickness, material, function) match the other dark controls (#174) */
    #layer-list input:not([type=hidden]):not([type=checkbox]), #layer-list select { background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 3px 6px; font-size: 12px; color-scheme: dark; }
    #layer-list input[type=checkbox] { accent-color: #6e8ec8; }

    #pane-resizer {
      width: 5px; flex-shrink: 0; cursor: ew-resize; background: #2a2a2a;
      transition: background 0.1s;
    }
    #pane-resizer:hover, #pane-resizer.dragging { background: #4a8aaa; }
    #form-panel { width: 380px; display: flex; flex-direction: column; overflow: hidden; }
    #layer-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
    #form-footer { padding: 8px 12px; border-top: 1px solid #333; display: flex; gap: 8px; }
    #form-footer button { padding: 5px 12px; cursor: pointer; background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px; }
    #form-footer button.icon-btn { display: flex; align-items: center; gap: 4px; }

    /* Phones (#160): one toolbar row that scrolls inside itself, icon-only buttons, and the form below the drawing
       rather than beside it; the page scrolls down to the form. */
    @media (max-width: 699px) {
      #header { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding: 6px 8px; scrollbar-width: thin; }
      #header > * { flex-shrink: 0; }
      #header .lbl { display: none; }
      #project-name { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 30; margin: 0; padding: 4px 8px; border-radius: 3px; background: rgba(24,24,24,0.88); color: #ddd; pointer-events: none; }
      #status:empty { display: none; }
      #main { flex-direction: column; overflow-y: auto; }
      #canvas-panel { flex: 0 0 62vh; padding: 12px; border-right: 0; border-bottom: 1px solid #333; }
      #pane-resizer { display: none; }
      #form-panel { width: auto !important; flex: 0 0 auto; overflow: visible; }
      #layer-list { flex: 0 0 auto; overflow: visible; }
    }
  </style>
</head>
<body>
  <div id="header">
    <a href="launch.html" class="home-link" title="All OEBF applications" aria-label="All OEBF applications"><i data-icon="home"></i></a>
    <span id="project-name" style="color:#aaa">No bundle open</span>
    <span class="sep"></span>
    <button id="new-btn" class="secondary icon-btn" disabled title="New profile"><i data-icon="new"></i><span class="lbl">New</span></button>
    <button id="open-btn" class="secondary icon-btn" title="Open a bundle folder"><i data-icon="open"></i><span class="lbl">Open</span></button>
    <button id="save-btn" class="icon-btn" disabled title="Save (Ctrl+S)"><i data-icon="save"></i><span class="lbl">Save</span></button>
    <button id="undo-btn" class="secondary icon-btn" disabled title="Undo (Ctrl+Z)" aria-label="Undo"><i data-icon="undo"></i></button>
    <button id="redo-btn" class="secondary icon-btn" disabled title="Redo (Ctrl+Shift+Z or Ctrl+Y)" aria-label="Redo"><i data-icon="redo"></i></button>
    <span id="dirty" hidden title="Unsaved changes" aria-label="Unsaved changes">●</span>
    <span class="sep"></span>
    <input id="profile-search" type="search" placeholder="Search profiles" style="width:120px;background:#333;color:#ddd;border:1px solid #555;border-radius:3px;padding:3px 6px;font-size:12px;" aria-label="Search profiles">
    <select id="profile-select" disabled aria-label="Profile"><option>— select profile —</option></select>
    <button id="dup-btn" class="secondary short" title="Save a copy of this profile under a new id" aria-label="Duplicate"><i data-icon="copy"></i><span class="lbl">Duplicate</span></button>
    <button id="rename-btn" class="secondary" title="Rename this profile and the elements and details that use it"><i data-icon="rename"></i><span class="lbl">Rename</span></button>
    <button id="delete-btn" class="secondary" title="Delete this profile (refused while anything uses it)"><i data-icon="delete"></i><span class="lbl">Delete</span></button>
    <span class="sep"></span>
    <button id="tool-rect-btn" class="secondary icon-btn" title="Draw a rectangular region"><i data-icon="rect"></i><span class="lbl">Rect</span></button>
    <button id="tool-poly-btn" class="secondary icon-btn" title="Draw a polygon region"><i data-icon="polygon"></i><span class="lbl">Polygon</span></button>
    <button id="add-h-guide-btn" class="secondary short" title="Add a horizontal guide" aria-label="H guide"><i data-icon="h-guide"></i><span class="lbl">H guide</span></button>
    <button id="add-v-guide-btn" class="secondary short" title="Add a vertical guide" aria-label="V guide"><i data-icon="v-guide"></i><span class="lbl">V guide</span></button>
    <span class="sep"></span>
    <button id="fit-btn" class="secondary icon-btn short" title="Fit the detail in view (wheel zooms, middle-drag or Shift-drag pans)" aria-label="Fit"><i data-icon="fit"></i><span class="lbl">Fit</span></button>
    <label for="units-select" style="font-size:12px;color:#aaa;">Units</label>
    <select id="units-select" title="Display units" style="background:#333;color:#ddd;border:1px solid #555;border-radius:3px;padding:3px 6px;font-size:12px;">
      <option value="mm" selected>mm</option>
      <option value="m">m</option>
    </select>
    <span id="status" role="status"></span>
  </div>
  <div id="main">
    <div id="canvas-panel">
      <svg id="profile-svg" viewBox="0 0 0.3 2.7" overflow="visible"></svg>
      <p id="canvas-prompt" role="status" hidden></p>
    </div>
    <div id="pane-resizer"></div>
    <div id="form-panel">
      <div id="lineweights-bar" style="padding:6px 12px;border-bottom:1px solid #333;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0;font-size:11px;">
        <span style="color:#aaa;" title="Pen weights in millimetres at print scale. Blank uses the default (a layer's outline follows its function).">Line weights</span>
        <label>Cut <select id="lw-cut"></select></label>
        <label>Seen <select id="lw-seen"></select></label>
        <label>Hatch <select id="lw-hatch"></select></label>
        <label>Notes <select id="lw-annotation"></select></label>
        <label style="margin-left:auto;" title="Draw every line as a hairline"><input type="checkbox" id="lw-thin"> Thin</label>
      </div>
      <div id="profile-meta" style="padding:8px 12px;border-bottom:1px solid #333;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;flex-shrink:0;">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;">
          Type
          <select id="profile-type-select" style="background:#333;color:#ddd;border:1px solid #555;border-radius:3px;padding:3px 6px;">
            <option value="wall">Wall</option>
            <option value="slab">Slab</option>
          </select>
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;" title="A slab aligned to a face stacks its layers from that face">
          Align
          <select id="profile-alignment-select" disabled style="background:#333;color:#ddd;border:1px solid #555;border-radius:3px;padding:3px 6px;">
            <option value="center">Centre (layers across x)</option>
            <option value="top-face">Top face (stacked)</option>
            <option value="bottom-face">Bottom face (stacked)</option>
          </select>
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;">
          <span id="ffl-label">FFL</span>
          <input id="ffl-input" type="number" value="0" step="1"
                 style="width:70px;background:#333;color:#ddd;border:1px solid #555;border-radius:3px;padding:3px 6px;">
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;">
          <span id="height-limit-label">H limit</span>
          <input id="height-limit-input" type="number" value="2400" min="0" step="1"
                 style="width:70px;background:#333;color:#ddd;border:1px solid #555;border-radius:3px;padding:3px 6px;">
        </label>
      </div>
      <div id="layer-list"></div>
      <div id="form-footer">
        <button id="add-layer-btn" class="icon-btn" disabled title="Add a layer"><i data-icon="add"></i><span class="lbl">Add layer</span></button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/profile-editor/editor.js"></script>
  <script>
    (function () {
      const STORAGE_KEY = 'oebf-profile-pane-width';
      const resizer   = document.getElementById('pane-resizer');
      const formPanel = document.getElementById('form-panel');
      const MIN_W = 240, MAX_W = 700;

      // Restore saved width
      const saved = sessionStorage.getItem(STORAGE_KEY);
      if (saved) formPanel.style.width = saved + 'px';

      let startX, startW;
      resizer.addEventListener('mousedown', e => {
        startX = e.clientX;
        startW = formPanel.offsetWidth;
        resizer.classList.add('dragging');
        e.preventDefault();
      });
      window.addEventListener('mousemove', e => {
        if (!resizer.classList.contains('dragging')) return;
        const delta = startX - e.clientX;
        const newW  = Math.min(MAX_W, Math.max(MIN_W, startW + delta));
        formPanel.style.width = newW + 'px';
        sessionStorage.setItem(STORAGE_KEY, newW);
      });
      window.addEventListener('mouseup', () => {
        resizer.classList.remove('dragging');
      });
    })();
  </script>
</body>
</html>
