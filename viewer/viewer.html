<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEBF Viewer</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/barlow.css">
  <link rel="stylesheet" href="/src/ui/ui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 16px; left: 16px;
      color: #fff; font-family: 'Barlow', sans-serif; font-size: 13px;
    }
    #ui button {
      padding: 6px 12px; cursor: pointer; background: #333; color: #fff;
      border: 1px solid #555; border-radius: 3px; margin-right: 8px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    #ui button:hover:not(:disabled) { background: #444; }
    #ui button:disabled { opacity: 0.4; cursor: default; }
    #ui .home-link { vertical-align: top; height: 30px; margin-right: 4px; }
    #status { margin-top: 8px; opacity: 0.6; }
    /* Phones (#160): the buttons show only their icons (each has a title), so they stay on one row. */
    @media (max-width: 699px) {
      #ui { top: 8px; left: 8px; right: 8px; }
      #ui button { padding: 6px 9px; margin-right: 4px; }
      #ui .lbl { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui">
    <a href="launch.html" class="home-link" title="All OEBF applications" aria-label="All OEBF applications"><i data-icon="home"></i></a>
    <button id="load-demo-btn" title="Load the terraced house example"><i data-icon="example"></i><span class="lbl">Load demo</span></button>
    <button id="open-dir-btn" title="Open a .oebf bundle folder"><i data-icon="open"></i><span class="lbl">Open .oebf folder</span></button>
    <button id="open-file-btn" title="Open a .oebfz archive (or a .zip saved by an earlier version)"><i data-icon="open-archive"></i><span class="lbl">Open archive</span></button>
    <button id="edit-profiles-btn" disabled title="Open the profiles of the loaded bundle in the profile editor (a .oebf folder or the demo, not an archive)"><i data-icon="layers"></i><span class="lbl">View profiles</span></button>
    <p id="status">No project loaded</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
