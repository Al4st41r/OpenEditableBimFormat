<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEBF Detail Axonometrics</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/barlow.css">
  <link rel="stylesheet" href="/src/ui/ui.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; color: #ddd; font-family: 'Barlow', sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; }
    button, select, input { font: inherit; }
    #header { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; padding: 6px 10px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; }
    #header select, #header input[type=text], .panel input[type=text] { background: #333; color: #ddd; border: 1px solid #555; padding: 3px 6px; border-radius: 3px; }
    button { padding: 4px 8px; cursor: pointer; background: #333; color: #ddd; border: 1px solid #555; border-radius: 3px; }
    button:hover:not(:disabled) { background: #444; }
    #header button { display: inline-flex; align-items: center; gap: 4px; }
    button.active { background: #1e3a5a; border-color: #4a8aaa; color: #fff; }
    .sep { width: 1px; align-self: stretch; background: #333; margin: 0 4px; }
    #project-name { opacity: 0.6; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #header .sep { margin: 0 1px; }
    [hidden] { display: none !important; }
    @media (max-width: 1599px) { .short .lbl { display: none; } }   /* secondary commands show only their icon on narrower screens */

    #status { margin-left: auto; opacity: 0.8; font-size: 12px; max-width: 40%; text-align: right; }
    #status.error { color: #f88; opacity: 1; }
    #main { display: flex; flex: 1; min-height: 0; }
    .panel { overflow-y: auto; padding: 8px 12px; background: #1e1e1e; flex-shrink: 0; }
    .panel[hidden] { display: none; }
    #left-panel { width: 280px; border-right: 1px solid #333; }
    #right-panel { width: 340px; border-left: 1px solid #333; }
    #panes { flex: 1; min-width: 0; display: flex; }
    #pane-2d { flex: 1 1 50%; min-width: 120px; position: relative; background: #fff; overflow: hidden; cursor: grab; }
    #pane-2d.panning { cursor: grabbing; }
    #divider { flex: 0 0 5px; background: #333; cursor: col-resize; z-index: 2; }
    #divider:hover, #divider.drag { background: #4a8aaa; }
    #zoom-hint { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: #999; pointer-events: none; }
    #drawing { position: absolute; inset: 0; transform-origin: 0 0; display: flex; align-items: center; justify-content: center; padding: 8px; }
    #drawing svg { max-width: 100%; max-height: 100%; width: 100%; height: 100%; }
    #pane-2d[hidden] { display: none; }
    .pane-label { position: absolute; left: 10px; top: 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #777; z-index: 1; pointer-events: none; }
    #canvas-wrap { flex: 1 1 50%; min-width: 0; position: relative; background: #f2f1ed; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; text-align: center; padding: 24px; pointer-events: none; }
    #empty[hidden] { display: none; }
    #empty-2d { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #888; font-size: 14px; text-align: center; padding: 24px; pointer-events: none; }
    #caption { position: absolute; left: 12px; bottom: 10px; background: rgba(24,24,24,0.82); color: #fff; padding: 4px 9px; border-radius: 3px; font-size: 12px; pointer-events: none; }
    h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #999; margin: 12px 0 6px; }
    h3:first-child { margin-top: 0; }
    .item { padding: 4px 8px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .item:hover { background: #2a2a2a; }
    .item.selected { background: #1e3a5a; }
    .item .meta { opacity: 0.55; font-size: 11px; margin-left: auto; flex-shrink: 0; }
    .item .swatch { width: 10px; height: 10px; border: 1px solid #555; flex-shrink: 0; }
    .legend-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 12px; }
    .legend-row .swatch { width: 12px; height: 12px; border: 1px solid #555; flex-shrink: 0; }
    .legend-row .swatch.nodata { background: repeating-linear-gradient(45deg, #bbb 0 1px, #eee 1px 4px); }
    .legend-row .count { margin-left: auto; opacity: .55; }
    .note { opacity: 0.6; font-size: 12px; margin: 4px 0; line-height: 1.5; }
    .warn { color: #fc6; font-size: 12px; margin: 3px 0; }
    .use { font-size: 12px; margin: 3px 0; line-height: 1.45; }
    .use code { color: #8cb4d8; }
    #detail-title { font-weight: 700; font-size: 14px; word-break: break-word; }
  </style>
</head>
<body>
  <div id="header">
    <a href="launch.html" class="home-link" title="All OEBF applications" aria-label="All OEBF applications"><i data-icon="home"></i></a>
    <button id="left-btn" class="active short" title="Show or hide the detail list" aria-label="List"><i data-icon="panel-left"></i><span class="lbl">List</span></button>
    <strong>Detail review</strong>
    <span id="project-name"></span>
    <span class="sep"></span>
    <button id="open-btn" title="Open a bundle folder"><i data-icon="open"></i><span class="lbl">Open</span></button>
    <button id="demo-btn" title="Load the NMB two-storey example"><i data-icon="example"></i><span class="lbl">NMB example</span></button>
    <span class="sep"></span>
    <button id="pane2d-btn" class="active short" title="Show the 2D drawing beside the 3D view" aria-label="2D"><i data-icon="split"></i><span class="lbl">2D</span></button>
    <select id="scale-select" title="Drawing scale of the 2D pane">
      <option value="1">1:1</option><option value="2">1:2</option><option value="5" selected>1:5</option><option value="10">1:10</option>
    </select>
    <button id="thin-btn" title="Draw every line as a hairline" class="short" aria-label="Thin"><i data-icon="thin"></i><span class="lbl">Thin</span></button>
    <select id="overlay-select" title="Colour both panes by a strategy"></select>
    <select id="carbon-unit" title="Carbon per kilogram or per cubic metre" hidden><option value="kg">per kg</option><option value="m3">per m3</option></select>
    <span class="sep"></span>
    <select id="view-select" title="Axonometric view"></select>
    <button id="members-btn" class="active short" title="Show the swept wall profiles" aria-label="Members"><i data-icon="layers"></i><span class="lbl">Members</span></button>
    <button id="regions-btn" class="active short" title="Show the detail's own regions" aria-label="Regions"><i data-icon="regions"></i><span class="lbl">Regions</span></button>
    <button id="guides-btn" class="active short" title="Show the reference lines (grid, FFL, level) in 3D" aria-label="Lines"><i data-icon="guide"></i><span class="lbl">Lines</span></button>
    <button id="clip-btn" class="active short" title="Cut the 3D view to the detail's clip region" aria-label="Clip"><i data-icon="clip"></i><span class="lbl">Clip</span></button>
    <button id="edges-btn" class="active short" title="Outline each solid" aria-label="Edges"><i data-icon="edges"></i><span class="lbl">Edges</span></button>
    <button id="fit-btn" title="Fit both views (double-click the 2D pane fits it alone)" class="short" aria-label="Fit"><i data-icon="fit"></i><span class="lbl">Fit</span></button>
    <button id="png-btn" title="Save the current view as a PNG" class="short" aria-label="PNG"><i data-icon="image"></i><span class="lbl">PNG</span></button>
    <select id="export-select" title="Export the 2D drawing on a sheet with a title block">
      <option value="">Export</option><option value="svg">SVG sheet</option><option value="pdf">PDF (print)</option><option value="dxf">DXF (mm)</option>
    </select>
    <select id="paper-select" title="Sheet size for export">
      <option value="">Auto</option><option>A4</option><option>A3</option><option>A2</option><option>A1</option>
    </select>
    <span class="sep"></span>
    <button id="edit-btn" title="Open this detail in the detail editor" disabled><i data-icon="edit"></i><span class="lbl">Edit detail</span></button>
    <button id="compare-btn" title="Show the detail as it was before your edits" hidden><i data-icon="history"></i><span class="lbl">Original</span></button>
    <button id="download-btn" title="Download the edited detail as JSON" hidden><i data-icon="download"></i><span class="lbl">Download edit</span></button>
    <button id="right-btn" class="active short" title="Show or hide the information panel" aria-label="Info"><i data-icon="panel-right"></i><span class="lbl">Info</span></button>
    <span id="status"></span>
  </div>
  <div id="main">
    <div id="left-panel" class="panel">
      <h3>Details</h3>
      <input id="filter" type="text" placeholder="Filter" style="width:100%; margin-bottom:6px;">
      <div id="list"></div>
    </div>
    <div id="panes">
      <div id="pane-2d"><span class="pane-label">2D</span><div id="drawing"></div><div id="empty-2d">The 2D drawing of the detail you pick appears here.</div><span id="zoom-hint">wheel zoom · drag pan · double-click fit</span></div>
      <div id="divider" title="Drag to resize the panes"></div>
      <div id="canvas-wrap">
        <span class="pane-label">3D</span>
        <canvas id="canvas"></canvas>
        <div id="empty">Open a bundle folder or load the NMB example, then pick a detail.</div>
        <div id="caption" hidden></div>
      </div>
    </div>
    <div id="right-panel" class="panel">
      <div id="info"></div>
    </div>
  </div>
  <script type="module" src="/src/detail-axo/main.js"></script>
</body>
</html>
